name: 'CI/CD'

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-license:
    name: Check licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v5

  validate:
    name: Build & validate
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
      BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
      BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
          fetch-depth: 0
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Assemble Debug and Pull Screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          force-avd-creation: false
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: |
            set -e
            ./gradlew connectedTstDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true || true
            mkdir -p ./artifacts/screenshots
            adb shell ls /sdcard/Android/data/nl.rijksoverheid.mgo.tst/files/Pictures/test_screenshots || true
            adb pull /sdcard/Android/data/nl.rijksoverheid.mgo.tst/files/Pictures/test_screenshots ./artifacts/screenshots || true
            ls -la ./artifacts/screenshots
      - name: Upload screenshots as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-screenshots
          path: ./artifacts/screenshots
