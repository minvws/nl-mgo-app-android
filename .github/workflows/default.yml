name: 'CI/CD'

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-license:
    name: Check licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v2

  setup:
    name: Checkout project, setup jdk and setup gradle
    runs-on: ubuntu-latest
    steps:
        - name: Checkout project
          uses: actions/checkout@v4
          with:
            lfs: 'true'
            fetch-depth: 0
        - name: Setup JDK
          uses: actions/setup-java@v4
          with:
            java-version: 17
            distribution: 'temurin'
        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v3

  lint:
    needs: setup
    name: Linting
    runs-on: ubuntu-latest
    steps:
      - name: Linting
        run: ./gradlew lintTstDebug ktlintCheck

  snapshots:
    needs: setup
    name: Snapshot tests
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot tests
        run: ./gradlew lintTstDebug verifyPaparazziDebug

  unit-tests:
    needs: setup
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Unit tests
        run: ./gradlew testTstDebug jacocoTestReport

  sonarcloud:
    needs: unit-tests
    name: SonarCloud scanner
    runs-on: ubuntu-latest
    steps:
      - name: SonarCloud scanner
        run: ./gradlew sonar --info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
