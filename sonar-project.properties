# Project info
sonar.organization=vws
sonar.projectKey=nl-mgo-app-android-private
sonar.projectName=nl-mgo-app-android-private

# Info links shown in SonarCloud
sonar.links.homepage=https://github.com/minvws/nl-mgo-app-android-private

# Encoding and language specific properties
sonar.sourceEncoding=UTF-8
#sonar.kotlin.source.version=
sonar.kotlin.threads=false

# Analysis scoping
sonar.sources=app
#sonar.tests=

# Code coverage
#sonar.coverage.jacoco.xmlReportPaths=
sonar.coverage.exclusions=public/**/*,templates/**/*,assets/**/*.test.ts,src/Controller/**/*,src/Form/**/*,assets/js/**/*

# Duplication exclusions
sonar.cpd.exclusions=
