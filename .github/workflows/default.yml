name: 'CI/CD'

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  check-license:
    name: Check licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE Compliance Check
        uses: fsfe/reuse-action@v2

  validate:
    name: Build & validate
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: 'true'
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3  
      # - name: Lint and format checks
      #   run: ./gradlew clean lintTstDebug ktlintCheck
      # - name: Snapshot tests
      #   run: ./gradlew verifyPaparazziDebug
      - name: Unit Tests
        run: ./gradlew testTstDebug jacocoTestReport
      - name: Sonar
        run: ./gradlew sonar --info
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Android Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: ./gradlew connectedTstDebugAndroidTest
          profile: pixel
      - name: Archive Test Results & Code Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            **/build/reports/
          retention-days: 5
      - name: Download Keystore
        run: echo $KEYSTORE_FILE | base64 --decode > mgo.keystore
      - name: Build Apps
        if: ${{ contains(github.event.pull_request.labels.*.name, 'Generate Builds') || github.ref == 'refs/heads/main' }}
        run: ./gradlew assembleTstRelease assembleAccRelease assembleProdRelease
      - name: Archive Apps
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk
          retention-days: 5
      - name: Set Release Notes
        if: ${{ contains(github.event.pull_request.labels.*.name, 'Generate Builds') || github.ref == 'refs/heads/main' }}
        run: |
          if [ ${{ github.event_name }} = 'pull_request' ]; then
            echo "RELEASE_NOTES=${{ github.event.pull_request.title }}" >> $GITHUB_ENV
          else
            echo "RELEASE_NOTES=main" >> $GITHUB_ENV
          fi
      - name: Distribute Apps
        if: ${{ contains(github.event.pull_request.labels.*.name, 'Generate Builds') || github.ref == 'refs/heads/main' }}
        run: ./gradlew appDistributionUploadTstRelease --groups=android-intern --releaseNotes="${RELEASE_NOTES}" appDistributionUploadAccRelease --groups=android-intern --releaseNotes="${RELEASE_NOTES}" appDistributionUploadProdRelease --groups=android-intern --releaseNotes="${RELEASE_NOTES}"

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: test-results
      - name: Run SonarCloud scanner
        uses: SonarSource/sonarcloud-github-action@v2.1.1
        env: 
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
