name: 'Run CI/CD'
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  default:
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
      KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
    runs-on: macos-12
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3  
      - name: Lint
        run: ./gradlew lintTstDebug ktlintCheck
      - name: Unit Tests
        run: ./gradlew testTstDebug
      - name: Android Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          script: ./gradlew connectedTstDebugAndroidTest
          profile: pixel
      - name: Archive Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports
          retention-days: 5
      - name: Download Keystore
        run: echo $KEYSTORE_FILE | base64 --decode > mgo.keystore
      - name: Build Apps
        if: "contains(github.event.pull_request.labels.*.name, 'Generate Builds')"
        run: ./gradlew assembleTstRelease assembleAccRelease assembleProdRelease
      - name: Archive Apps
        uses: actions/upload-artifact@v4
        with:
          name: apks
          path: |
            app/build/outputs/apk
          retention-days: 5
      - name: Distribute Apps
        if: "contains(github.event.pull_request.labels.*.name, 'Generate Builds')"
        run: ./gradlew appDistributionUploadTstRelease appDistributionUploadAccRelease appDistributionUploadProdRelease --groups=android-intern --releaseNotes='${{ github.event.pull_request.title }}'
